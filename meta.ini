nexusDescription="[center][size=6][b]STARCADE OS[/b][/size]\n<br />[size=4][b]Created by X-2357[/b][/size][/center]\n<br />\n<br />[center]Starcade OS adds a portable arcade operating system to Starfield. It contains[/center]\n<br />[center]twenty-six games inside a unified Starfield-themed interface, supports[/center]\n<br />[center]keyboard and controller input, preserves high scores, and can be opened with a[/center]\n<br />[center]reusable inventory pad or configurable hotkey.[/center]\n<br />[center][/center]\n<br />[center]Every included game was written specifically for Starcade OS. This download[/center]\n<br />[center]does not contain ROMs, emulators, copied arcade games, remote content,[/center]\n<br />[center]third-party game assets, music, external fonts, advertising, or analytics.\n<br />\n<br />For access to dev builds and direct feature requests and mod suggestions, please visit my [url=https://www.patreon.com/cw/x2357][/url][url=https://patreon.com/x2357?utm_medium=unknown&amp;utm_source=join_link&amp;utm_campaign=creatorshare_creator&amp;utm_content=copyLink]patreon[/url]!\n<br />\n<br />[url=https://www.patreon.com/cw/x2357]My Patreon![/url][/center]\n<br />\n<br />[size=5][b]Main features[/b][/size]\n<br />[line]\n<br />\n<br />[list]\n<br />[*]Twenty-six complete, original offline games.[/*]\n<br />[*]Unified controller-friendly game library.[/*]\n<br />[*]Automatic Starcade Pad delivery through a small startup quest.[/*]\n<br />[*]Configurable F9 launcher hotkey through OSF UI settings.[/*]\n<br />[*]Arrow-key, keyboard, D-pad, and controller-button support.[/*]\n<br />[*]Persistent high scores, play counts, save data, and achievements.[/*]\n<br />[*]Full editable source for every game is included in the normal installation.[/*]\n<br />[/list][size=5][b]Included games[/b][/size]\n<br />[line]\n<br />\n<br />[size=4][b]Great Serpent[/b][/size]\n<br />\n<br />Guide the Great Serpent through a xenobiology grid, consume stellar energy,\n<br />grow longer, and avoid colliding with the containment boundary or yourself.\n<br />\n<br />[b][size=4]FreeDOOM[/size][/b]\n<br />\n<br />Open Source Doom Clone.\n<br />\n<br />[size=4][b]Meteor Field[/b][/size]\n<br />\n<br />A vector-space survival game. Rotate, thrust, preserve momentum, fire on\n<br />asteroids, and survive the increasingly dense debris field.\n<br />\n<br />[size=4][b]Orbital Paddle[/b][/size]\n<br />\n<br />A fast paddle duel against an automated opponent. Defend the relay, return the\n<br />orb, and score by breaking through the opposing side.\n<br />\n<br />[size=4][b]Reactor Breaker[/b][/size]\n<br />\n<br />Use a movable containment paddle to keep the reactor sphere active and clear\n<br />every unstable cell in the chamber.\n<br />\n<br />[size=4][b]Minefield Protocol[/b][/size]\n<br />\n<br />Scan a concealed orbital minefield, interpret neighboring-mine counts, and\n<br />open every safe sector without triggering a mine.\n<br />\n<br />[size=4][b]Lunar Descent[/b][/size]\n<br />\n<br />Control horizontal translation and limited vertical thrust to land a fragile\n<br />survey craft on the illuminated pad at a safe velocity.\n<br />\n<br />[size=4][b]Memory Matrix[/b][/size]\n<br />\n<br />Navigate a grid of concealed navigation symbols and restore every matching\n<br />pair using as few attempts as possible.\n<br />\n<br />[size=4][b]Signal Relay[/b][/size]\n<br />\n<br />Observe an expanding directional transmission and repeat the complete sequence\n<br />using the D-pad or arrow keys.\n<br />\n<br />[size=4][b]Void Invaders[/b][/size]\n<br />\n<br />Defend the settled systems from descending formations of hostile craft. Move,\n<br />fire, clear the formation, and prevent the attackers from reaching your line.\n<br />\n<br />[size=4][b]Starfall Blocks[/b][/size]\n<br />\n<br />Move and rotate falling cargo formations, complete horizontal rows, and keep\n<br />the cargo hold from filling to the top.\n<br />\n<br />[size=4][b]Docking Vector[/b][/size]\n<br />\n<br />Use four-direction translation to match position and velocity with a moving\n<br />orbital docking collar before time expires.\n<br />\n<br />[size=4][b]Space Racer[/b][/size]\n<br />\n<br />Pilot a high-speed ship through multiple traffic lanes while the pace and\n<br />hazard density continually increase.\n<br />\n<br />[size=4][b]Fleet Command[/b][/size]\n<br />\n<br />Search a concealed tactical grid and destroy the entire hostile fleet using\n<br />careful targeting and as few wasted shots as possible.\n<br />\n<br />[size=4][b]Missile Defense[/b][/size]\n<br />\n<br />Move the targeting reticle and create expanding interception fields before\n<br />incoming warheads reach the colony.\n<br />\n<br />[size=4][b]Orbital Checkers vs CPU[/b][/size]\n<br />\n<br />Play a complete checkers match as the green side against the Starcade computer.\n<br />The CPU evaluates legal moves, prioritizes captures, and moves automatically.\n<br />\n<br />[size=4][b]Galactic Chess vs CPU[/b][/size]\n<br />\n<br />Command the mint fleet in a complete-board strategy match against Starcade's\n<br />independently written CPU move evaluator.\n<br />\n<br />[size=4][b]Casino collection[/b][/size]\n<br />\n<br />Red Mile Blackjack, UC Video Poker, Red Mile Hold 'Em, Orbital Roulette, Neon\n<br />Constellation Slots, Settled Systems Dice, Celestial High / Low, and Red Mile\n<br />Racing Book use the player's real in-game credits. The transaction bridge\n<br />guards against duplicate charges and invalid payouts, and automatically\n<br />refunds an unfinished active stake when the player returns to the library.\n<br />\n<br />[size=5][b]Requirements[/b][/size]\n<br />[line]\n<br />Address Library for SFSE Plugins.\n<br />The current OSF UI release with native bridge ABI 1.4 support:\n<br />\n<br />  https://www.nexusmods.com/starfield/mods/17711\n<br />\n<br />These requirements are not included in the Starcade archive and retain their\n<br />own licenses, authors, support pages, and update schedules.\n<br />\n<br />[size=5][b]Installation with Mod Organizer 2 or Vortex[/b][/size]\n<br />[line]\n<br />\n<br />[list=1]\n<br />[*]Install SFSE, Address Library, and OSF UI first.[/*]\n<br />[*]Download the Starcade OS archive.[/*]\n<br />[*]Install it normally with MO2 or Vortex.[/*]\n<br />[*]Enable [b]x2357starcade.esm[/b] in the plugin list.[/*]\n<br />[*]Launch Starfield through [b]sfse_loader.exe[/b].[/*]\n<br />[/list]\n<br />\n<br />The archive root is already arranged as the Starfield Data directory. It opens\n<br />directly to [b]x2357starcade.esm[/b], [b]Scripts[/b], and [b]SFSE[/b]; do not create another\n<br />nested Data folder.\n<br />\n<br />Starcade registers its view automatically. Do not manually add Starcade to an\n<br />OSF UI configuration file, and do not allow another mod to overwrite OSF UI's\n<br />configuration on Starcade's behalf.\n<br />\n<br />[size=5][b]Starting Starcade[/b][/size]\n<br />[line]\n<br />\n<br />The startup quest checks the player's inventory and silently adds one Starcade\n<br />Pad when none is present. Find [b]Starcade Pad[/b] under Aid and use it to open the\n<br />arcade. The item restores itself after use and is not permanently consumed.\n<br />\n<br />You can also press [b]F9[/b]. The hotkey can be rebound in OSF UI settings and\n<br />remains available if the inventory item is misplaced.\n<br />\n<br />[size=5][b]General controls[/b][/size]\n<br />[line]\n<br />\n<br />[list]\n<br />[*]Arrow keys / D-pad: navigate menus and most games.[/*]\n<br />[*]Enter / controller A: select or perform the primary action.[/*]\n<br />[*]Space: fire in games that use a dedicated fire control.[/*]\n<br />[*]Escape / controller B: return to the library or close Starcade.[/*]\n<br />[*]Individual controls are displayed on every library card and game screen.[/*]\n<br />[/list]\n<br />\n<br />[size=5][b]Saves and high scores[/b][/size]\n<br />[line]\n<br />\n<br />The native Starcade plugin records high scores, play counts, game saves, and\n<br />achievement state in:\n<br />\n<br />[b]Documents/My Games/Starfield/Starcade/state.json[/b]\n<br />\n<br />Removing this file resets Starcade's stored progression. It does not alter a\n<br />Starfield save. Invalid state data is quarantined instead of being silently\n<br />overwritten.\n<br />\n<br />[size=5][b]Game source code and modding permissions[/b][/size]\n<br />[line]\n<br />\n<br />The full source code for every included game is distributed with the mod. The\n<br />browser games do not use hidden binaries, obfuscated bundles, downloaded\n<br />scripts, or proprietary game engines. Their HTML, CSS, and JavaScript files are\n<br />the files OSF UI runs directly.\n<br />\n<br />After installation, the game source is located under:\n<br />\n<br />[b]SFSE/Plugins/OSFUI/views/starcade.arcade/launcher/games/[/b]\n<br />\n<br />Shared game integration code:\n<br />\n<br />[list]\n<br />[*][b]games/host.js[/b] â€” score, save, achievement, exit, and input bridge.[/*]\n<br />[*][b]games/game.css[/b] â€” shared game layout and X-2357 attribution.[/*]\n<br />[*][b]games/catalog.js[/b] â€” titles, categories, entries, controls, colors, and license data.[/*]\n<br />[/list]\n<br />\n<br />Each game has its own folder containing:\n<br />\n<br />[list]\n<br />[*][b]index.html[/b] â€” game screen and script entry point.[/*]\n<br />[*][b]game.js[/b] â€” complete gameplay, drawing, controls, scoring, and state logic.[/*]\n<br />[/list]\n<br />\n<br />The launcher source is also included:\n<br />\n<br />[list]\n<br />[*][b]launcher/index.html[/b] â€” launcher structure.[/*]\n<br />[*][b]launcher/style.css[/b] â€” complete launcher presentation.[/*]\n<br />[*][b]launcher/main.js[/b] â€” library navigation, iframe hosting, scoring, saving, and OSF bridge behavior.[/*]\n<br />[*][b]launcher/manifest.json[/b] â€” OSF UI permissions and view metadata.[/*]\n<br />[/list]\n<br />\n<br />Papyrus source is included under [b]Scripts/Source[/b] for the reusable pad effect\n<br />and automatic player-alias delivery script. Compiled [b].pex[/b] files are included\n<br />under [b]Scripts[/b] for normal users.\n<br />\n<br />All original Starcade game, launcher, and Papyrus source is copyright 2026\n<br />X-2357 and is released under the included MIT License. You may study, copy,\n<br />modify, merge, publish, and redistribute that original source, including in\n<br />other projects, provided you preserve the copyright and MIT permission notice.\n<br />\n<br />When publishing a modified build, clearly identify your changes and do not\n<br />present it as an official or supported X-2357 release. â€œStarfield,â€ Bethesda\n<br />assets, SFSE, Address Library, OSF UI, CommonLibSF, spdlog, and nlohmann/json\n<br />are not relicensed by Starcade's MIT License. Follow their respective terms.\n<br />\n<br />The compiled Starcade native SFSE component is licensed separately under GPLv3\n<br />or later because it uses GPL-covered CommonLibSF and the OSF UI SDK. Its C++\n<br />source, build script, SDK interface, exact dependency source, and GPL text are\n<br />provided in the separate [b]Starcade OS 1.3.0 Complete Source[/b] archive intended\n<br />for the Nexus Optional Files section.\n<br />\n<br />See [b]LICENSE-MIT.txt[/b], [b]LICENSE-GPL-3.0.txt[/b], and\n<br />[b]THIRD_PARTY_NOTICES.md[/b] in the download for the controlling\n<br />license text and dependency notices. This description is an overview and does\n<br />not replace those files.\n<br />\n<br />[size=5][b]Game-by-game code provenance[/b][/size]\n<br />[line]\n<br />\n<br />No game implementation in Starcade was downloaded from GitHub, copied from an\n<br />open-source browser-game collection, extracted from another mod, translated\n<br />from a ROM, or copied from a commercial game. The source for each game was\n<br />written specifically for this project by X-2357 using ordinary HTML canvas and\n<br />JavaScript APIs.\n<br />\n<br />Several games deliberately use familiar genre mechanics. The mechanical idea\n<br />or traditional rule set is identified below so users can understand the design\n<br />lineage without mistaking that lineage for copied code:\n<br />\n<br />[b]Great Serpent[/b]\n<br />[i]Design lineage:[/i] Grid-based Snake genre\n<br />Independently written movement, growth, food, collision, scoring, and canvas rendering. No external Snake project used.\n<br />\n<br />[b]Meteor Field[/b]\n<br />[i]Design lineage:[/i] Classic vector asteroid-field arcade genre\n<br />Independently written momentum, rotation, thrust, projectile, asteroid splitting, collision, and vector drawing. No external code or assets used.\n<br />\n<br />[b]Orbital Paddle[/b]\n<br />[i]Design lineage:[/i] Traditional two-paddle ball games\n<br />Independently written paddle, ball, opponent, collision, and scoring logic. No original arcade-game source or audiovisual assets used.\n<br />\n<br />[b]Reactor Breaker[/b]\n<br />[i]Design lineage:[/i] Brick-and-paddle arcade genre\n<br />Independently written brick grid, paddle, ball, collision, clearing, and scoring. No Breakout clone source or assets imported.\n<br />\n<br />[b]Minefield Protocol[/b]\n<br />[i]Design lineage:[/i] Traditional neighboring-mine deduction rules\n<br />Independently written board generation, neighbor counts, recursive opening, navigation, and rendering. No Minesweeper source or graphics used.\n<br />\n<br />[b]Lunar Descent[/b]\n<br />[i]Design lineage:[/i] Lunar-lander thrust and velocity genre\n<br />Independently written gravity, thrust, fuel, landing tolerance, terrain, scoring, and drawing. No external lander source used.\n<br />\n<br />[b]Memory Matrix[/b]\n<br />[i]Design lineage:[/i] Traditional concentration/matching-pairs game\n<br />Independently written shuffle, selection, pair matching, timing, symbols, scoring, and canvas presentation.\n<br />\n<br />[b]Signal Relay[/b]\n<br />[i]Design lineage:[/i] Traditional repeat-the-sequence memory game\n<br />Independently written sequence generation, playback timing, directional input, validation, scoring, and presentation. No commercial-game audiovisual material used.\n<br />\n<br />[b]Void Invaders[/b]\n<br />[i]Design lineage:[/i] Descending-formation shooter genre\n<br />Independently written formation motion, player movement, firing, hit detection, wave behavior, and vector shapes. No Space Invaders sprites, sounds, source, or level data used.\n<br />\n<br />[b]Starfall Blocks[/b]\n<br />[i]Design lineage:[/i] Falling-block puzzle genre\n<br />Independently written piece definitions, rotation, collision, locking, row clearing, scoring, and rendering. No Tetris source, branding, music, or assets used.\n<br />\n<br />[b]Docking Vector[/b]\n<br />[i]Design lineage:[/i] Orbital docking and velocity matching\n<br />Original Starcade design with independently written translation physics, moving target, docking tolerance, timer, scoring, and display.\n<br />\n<br />[b]Space Racer[/b]\n<br />[i]Design lineage:[/i] Lane-dodging endless racer genre\n<br />Original Starcade implementation with independently written steering, traffic generation, speed progression, collision, and scoring.\n<br />\n<br />[b]Fleet Command[/b]\n<br />[i]Design lineage:[/i] Traditional hidden-grid naval guessing games\n<br />Independently written fleet placement, targeting grid, hit tracking, navigation, and scoring. No Battleship-branded code, board data, or assets used.\n<br />\n<br />[b]Missile Defense[/b]\n<br />[i]Design lineage:[/i] Expanding-interceptor defense genre\n<br />Independently written aiming, incoming trajectories, expanding interception fields, collision, colony failure, and scoring. No Missile Command source, art, sounds, or levels used.\n<br />\n<br />[b]Orbital Checkers vs CPU[/b]\n<br />[i]Design lineage:[/i] Standard Checkers rules\n<br />Independently written board setup, legal moves, captures, turn handling, win detection, controller navigation, and CPU move selection.\n<br />\n<br />\n<br />The source files named in this table are shipped directly under each game's\n<br />folder as [b]game.js[/b] and [b]index.html[/b]. They are the preferred form for editing;\n<br />there is no separate hidden or generated game-code bundle.\n<br />\n<br />[size=5][b]Compatibility[/b][/size]\n<br />[line]\n<br />\n<br />[list]\n<br />[*]Starcade does not replace vanilla interface files.[/*]\n<br />[*]Starcade does not ship an OSF UI configuration override.[/*]\n<br />[*]The included [b].esm[/b] is the runtime master; no editable [b].esp[/b] is installed.[/*]\n<br />[*]The interface is offline and requests no network or filesystem access.[/*]\n<br />[*]Mods that change unrelated Aid items should not conflict.[/*]\n<br />[*]Updates to Starfield, SFSE, Address Library, or OSF UI may require a matching[/*]\n<br />[/list]\n<br />  Starcade native-plugin update.\n<br />\n<br />[size=5][b]Updating[/b][/size]\n<br />[line]\n<br />\n<br />Install the newer archive over the previous Starcade version and allow its own\n<br />files to replace older Starcade files. Do not merge files from multiple\n<br />Starcade versions. Existing native state is stored outside the mod directory\n<br />and should remain available after updating.\n<br />\n<br />[size=5][b]Uninstalling[/b][/size]\n<br />[line]\n<br />\n<br />[list=1]\n<br />[*]Close Starfield.[/*]\n<br />[*]Disable [b]x2357starcade.esm[/b].[/*]\n<br />[*]Remove Starcade OS through your mod manager.[/*]\n<br />[*]Optionally delete [b]Documents/My Games/Starfield/Starcade/state.json[/b] to erase[/*]\n<br />[/list]\n<br />  stored scores and progression.\n<br />\n<br />The automatically granted pad will become unavailable when the plugin is no\n<br />longer loaded. As with any plugin removal, making a permanent save before\n<br />installation and avoiding mid-playthrough plugin removal are sensible\n<br />precautions.\n<br />\n<br />[size=5][b]Troubleshooting[/b][/size]\n<br />[line]\n<br />\n<br />[size=4][b]Starcade does not open[/b][/size]\n<br />\n<br />[list]\n<br />[*]Confirm the game was launched through [b]sfse_loader.exe[/b].[/*]\n<br />[*]Confirm SFSE, Address Library, and OSF UI match the installed game version.[/*]\n<br />[*]Confirm [b]x2357starcade.esm[/b] is enabled.[/*]\n<br />[*]Try the default F9 hotkey.[/*]\n<br />[/list]\n<br />\n<br />[size=4][b]The Starcade Pad is missing[/b][/size]\n<br />\n<br />[list]\n<br />[*]Load the save once with the plugin enabled and wait several seconds.[/*]\n<br />[*]Confirm the startup quest exists by checking that the correct [b].esm[/b] is active.[/*]\n<br />[*]F9 remains available as a fallback.[/*]\n<br />[/list]\n<br />\n<br />[size=4][b]A game opens but input controls Starfield[/b][/size]\n<br />\n<br />[list]\n<br />[*]Update OSF UI.[/*]\n<br />[*]Check for another UI mod overriding OSF input behavior.[/*]\n<br />[*]Include the OSF UI log when reporting the problem.[/*]\n<br />[/list]\n<br />\n<br />[size=4][b]Scores do not persist[/b][/size]\n<br />\n<br />[list]\n<br />[*]Check that [b]Documents/My Games/Starfield/Starcade[/b] is writable.[/*]\n<br />[*]Temporarily move a damaged [b]state.json[/b] and allow Starcade to create a new one.[/*]\n<br />[*]Check security software or controlled-folder-access restrictions.[/*]\n<br />[/list]\n<br />\n<br />[size=5][b]Bug reports[/b][/size]\n<br />[line]\n<br />\n<br />Please include:\n<br />\n<br />[list]\n<br />[*]Starfield runtime version.[/*]\n<br />[*]SFSE version.[/*]\n<br />[*]Address Library version.[/*]\n<br />[*]OSF UI version.[/*]\n<br />[*]Mod manager and profile used.[/*]\n<br />[*]Keyboard or controller model.[/*]\n<br />[*]The exact game and steps that reproduce the issue.[/*]\n<br />[*][b]Documents/My Games/Starfield/SFSE/Logs/Starcade.log[/b], when present.[/*]\n<br />[*]The OSF UI log.[/*]\n<br />[/list]\n<br />\n<br />[size=5][b]Credits[/b][/size]\n<br />[line]\n<br />\n<br />[list]\n<br />[*][b]X-2357[/b] â€” Starcade concept, design, launcher, native integration, Papyrus integration, and all twenty-four games.[/*]\n<br />[*][b]ozooma10[/b] â€” OSF UI and its public native/web integration framework.[/*]\n<br />[*][b]SFSE team[/b] â€” Starfield Script Extender.[/*]\n<br />[*][b]CommonLibSF contributors[/b] â€” native Starfield plugin framework.[/*]\n<br />[*][b]spdlog contributors[/b] â€” native logging library.[/*]\n<br />[*][b]Niels Lohmann and contributors[/b] â€” nlohmann/json.[/*]\n<br />[*][b]Bethesda Game Studios[/b] â€” Starfield and the Creation Kit.[/*]\n<br />[/list]\n<br />\n<br />[size=5][b]License summary[/b][/size]\n<br />[line]\n<br />\n<br />Starcade's original web games, launcher, and Papyrus source are provided under\n<br />the MIT License with no warranty. The native SFSE plugin and its corresponding\n<br />source are GPLv3-or-later. Full MIT and GPLv3 texts are included. Dependency and\n<br />platform notices are in [b]THIRD_PARTY_NOTICES.md[/b]. All game source is included\n<br />in the main mod; complete native and dependency source is supplied as a\n<br />separate source archive on the same Nexus page."
